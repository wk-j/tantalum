version = 1
sources = ["docs/adr"]

# docs/adr/0001-agents-use-secrets-by-name.md

[[check]]
name = "rails.value-sinks"
argv = ["go", "test", "-run", "^TestRailsSecretValuesReachOnlyChildEnvAndRedactor$", "./cmd/ta"]
timeout_s = 120

[[check]]
name = "rails.run-redacts-all"
argv = ["go", "test", "-run", "^(TestRailsRunRedactsEveryEnvironment|TestRedactorAcrossWriteBoundaries)$", "./cmd/ta"]
timeout_s = 120

[[check]]
name = "rails.vault-encrypted"
argv = ["go", "test", "-run", "^TestRailsVaultFileHoldsOnlyCiphertext$", "./cmd/ta"]
timeout_s = 120

[[check]]
name = "rails.value-not-from-argv"
argv = ["go", "test", "-run", "^TestRailsValuesEnterTheVaultOnlyFromPromptStdinOrRequestBody$", "./cmd/ta"]
timeout_s = 120

[[check]]
name = "rails.key-not-in-argv"
argv = ["go", "test", "-run", "^TestRailsKeychainKeyIsNeverAProcessArgument$", "./cmd/ta"]
timeout_s = 120

# docs/adr/0002-command-named-ta.md

[[check]]
